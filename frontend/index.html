<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог навчальних ресурсів - Баку</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Каталог навчальних ресурсів</h1>

        <form id="resource-form">
            <div class="form-group">
                <label for="res-title">Назва (Title):</label>
                <input type="text" id="res-title" placeholder="Введіть назву ресурсу" required>
            </div>

            <div class="form-group">
                <label for="res-url">Посилання (URL):</label>
                <input type="url" id="res-url" placeholder="https://example.com" required>
            </div>

            <div class="form-group">
                <label for="res-type">Тип (Type):</label>
                <select id="res-type">
                    <option value="Стаття">Стаття</option>
                    <option value="Відео">Відео</option>
                    <option value="Книга">Книга</option>
                    <option value="Курс">Курс</option>
                    <option value="Документація">Документація</option>
                </select>
            </div>

            <div class="form-group">
                <label for="res-author">Автор (Author):</label>
                <input type="text" id="res-author" placeholder="Прізвище автора" required>
            </div>

            <div class="form-group">
                <label for="res-description">Опис (Description):</label>
                <textarea id="res-description" rows="3" placeholder="Коротко про що ресурс"></textarea>
            </div>

            <button type="submit" id="add-btn">Додати ресурс</button>
        </form>

        <hr>

        <div id="stats-display" style="padding: 15px; background: #f8f9fa; margin: 15px 0; border-radius: 8px; border: 1px solid #dee2e6; display: flex; gap: 20px; font-family: sans-serif; font-size: 14px; color: #333;">
            <strong>Статистика:</strong> завантаження...
        </div>

        <table>
            <thead id="tableHeader">
                <tr>
                    <th data-columnName="id" style="cursor: pointer;">ID ⬍</th>
                    <th data-columnName="title" style="cursor: pointer;">Назва та Опис ⬍</th>
                    <th data-columnName="author" style="cursor: pointer;">Автор ⬍</th>
                    <th data-columnName="type" style="cursor: pointer;">Тип ⬍</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script src="models/ResourceDto.js"></script>
    <script src="services/ResourceService.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
